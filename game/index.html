<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultbreak — a stealth heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; }
  body { display: grid; place-items: center; }
  #game { width: min(100vw, 150vh); height: auto; aspect-ratio: 3 / 2; display: block; background: #131a2e; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640" aria-label="Vaultbreak: sneak the thief past guards and cameras, grab the loot, reach the getaway van"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
